<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Python-Wheels...</title>
  
  <!-- Instant Redirect -->
  <meta http-equiv="refresh" content="0; url=https://python-wheels.github.io/">
  
  <!-- Canonical SEO Tag to prevent duplicate index penalties -->
  <link rel="canonical" href="https://python-wheels.github.io/">
  
  <script>
    // Preserves query strings or sub-paths if someone typed pywheels.github.io/simple/
    const target = "https://python-wheels.github.io" + window.location.pathname + window.location.search;
    window.location.replace(target);
  </script>

  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 4rem 1rem; color: #333; }
    a { color: #0969da; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Redirecting to Python-Wheels Registry...</h2>
  <p>If you are not redirected automatically, follow this link to <a href="https://python-wheels.github.io/">python-wheels.github.io</a>.</p>
</body>
</html>
